name: Release artifact

on:
  push:
    branches: ["codex/app-store-submission"]
    paths:
      - "AirPad/**"
      - "AirPad.xcodeproj/**"
      - ".github/workflows/release-artifact.yml"
  workflow_dispatch:

jobs:
  archive:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check imports
        run: bash scripts/check-imports.sh
      - name: Archive release without signing credentials
        run: |
          set -o pipefail
          xcodebuild archive \
            -project AirPad.xcodeproj \
            -scheme AirPad \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Wield.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
      - name: Package archive
        run: tar -czf "$RUNNER_TEMP/Wield.xcarchive.tar.gz" -C "$RUNNER_TEMP" Wield.xcarchive
      - uses: actions/upload-artifact@v4
        with:
          name: Wield-release-archive
          path: ${{ runner.temp }}/Wield.xcarchive.tar.gz
          retention-days: 14
