name: App Review access

on:
  push:
    branches: ["codex/app-store-submission", "codex/remote-access-files"]
    paths:
      - "AirPad/**"
      - "AirPadUITests/**"
      - "AirPadTests/**"
      - "AirPad.xcodeproj/**"
      - ".github/workflows/app-review-tests.yml"
  workflow_dispatch:

jobs:
  review-access:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 17 Pro Max", "iPad Air 11-inch (M3)"]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a fresh available Simulator
        run: |
          if ! xcrun simctl list runtimes --json | python3 -c 'import json,sys; sys.exit(not any(r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-") for r in json.load(sys.stdin)["runtimes"]))'; then
            xcodebuild -downloadPlatform iOS
          fi
          python3 scripts/prepare-test-simulator.py '${{ matrix.device }}' >> "$GITHUB_ENV"
      - name: Test fresh onboarding and unpaired purchase access
        run: |
          set -o pipefail
          xcrun simctl boot "$TEST_SIMULATOR_ID"
          xcrun simctl bootstatus "$TEST_SIMULATOR_ID" -b
          xcodebuild test \
            -project AirPad.xcodeproj \
            -scheme AppReview \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$TEST_SIMULATOR_ID" \
            -only-testing:AirPadUITests/AppReviewAccessTests \
            -only-testing:AirPadTests/RemoteConnectionTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/AppReview.xcresult" \
            ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES
      - name: Export test screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/AppReview.xcresult" \
            --output-path "$RUNNER_TEMP/review-screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-access-${{ matrix.device }}
          path: |
            ${{ runner.temp }}/AppReview.xcresult
            ${{ runner.temp }}/review-screenshots
          retention-days: 14
